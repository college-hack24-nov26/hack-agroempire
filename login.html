<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Krushi Drishti</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

    <div class="auth-card">
        <div class="auth-logo">🌱</div>
        <h1>Krushi Drishti</h1>
        <p class="auth-subtitle">Welcome Farmer!</p>

        <!-- Feedback messages -->
        <div id="authStatus" class="auth-status"></div>

        <form id="loginForm">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <button type="submit" id="loginBtn" class="auth-btn">Login</button>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <!-- Firebase SDKs (Compat version for browser script tags) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>

    <!-- App Firebase Config & Auth Logic -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
