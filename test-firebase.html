<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Firebase Connection Test</title>
    <!-- Load the same Firebase SDK version used by the app -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>
    <!-- Project configuration (initializes app, auth, database) -->
    <script src="js/firebase-config.js"></script>
    <script>
        // Simple connection test – write and read a node under /testConnection
        (function(){
            if (!window.database) {
                console.error('❌ Database reference not available – Firebase may not be initialized');
                return;
            }
            const testRef = window.database.ref('testConnection');
            const payload = { timestamp: Date.now(), test: 'firebase-connection-ok' };
            testRef.set(payload)
                .then(() => {
                    console.log('✅ Write succeeded', payload);
                    return testRef.once('value');
                })
                .then(snapshot => {
                    console.log('✅ Read back:', snapshot.val());
                })
                .catch(err => {
                    console.error('❌ Firebase test failed', err);
                });
        })();
    </script>
</head>
<body>
    <h1>Firebase Connection Test</h1>
    <p>Open the browser console (F12) to see the test results.</p>
</body>
</html>
